<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathematics in Motion — The Beauty of Curves &amp; Fourier</title>
<meta name="description" content="An interactive canvas where parametric curves and Fourier epicycles turn pure mathematics into living, colorful art.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage"></canvas>

<div class="ui">
  <header>
    <h1>Mathematics <span class="grad">in Motion</span></h1>
    <p class="tagline">Parametric curves &amp; Fourier epicycles, painted with light.</p>
  </header>

  <section class="control-card">
    <div class="input-wrap">
      <div class="fancy-input">
        <span class="prompt">f(t)&nbsp;=&nbsp;</span>
        <input id="formula-input" type="text" spellcheck="false" autocomplete="off"
               placeholder='try "heart" — or x(t); y(t) like  16*sin(t)^3 ; 13*cos(t)-5*cos(2t)-2*cos(3t)-cos(4t)'>
        <button id="render-btn" title="Render">▶</button>
      </div>
      <div id="error-msg" class="error"></div>
    </div>

    <div class="chips" id="chips"></div>

    <div class="modes">
      <button id="mode-trace" class="mode-btn active" title="A glowing comet traces the curve">✦ Trace Mode</button>
      <button id="mode-fourier" class="mode-btn" title="Rotating circles (Fourier series) redraw the curve">◎ Fourier Mode</button>
    </div>
  </section>

  <section class="stage-wrap">
    <canvas id="stage"></canvas>
  </section>

  <aside class="info-card" id="info-card">
    <h2 id="info-name">Heart Curve</h2>
    <p class="formula" id="info-formula"></p>
    <p id="info-story"></p>
  </aside>

  <footer>
    <p>Type a preset name (<em>heart, rose, butterfly, lissajous, spiral, astroid, lemniscate</em>)
       or your own parametric pair <code>x(t); y(t)</code>. Then flip to
       <strong>Fourier Mode</strong> and watch circles reinvent your curve.</p>
  </footer>
</div>

<script src="js/parser.js"></script>
<script src="js/curves.js"></script>
<script src="js/fourier.js"></script>
<script src="js/main.js"></script>
</body>
</html>
